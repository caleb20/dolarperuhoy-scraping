name: Scraper Cron

on:
  schedule:
    - cron: "*/5 * * * *" # cada 5 minutos
  workflow_dispatch: # ejecución manual

concurrency:
  group: scraper-cron
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Antes esto solo estaba en el paso "Run scraper", asi que "npm ci" SI descargaba el
      # Chromium que trae empaquetado el paquete "puppeteer" (no puppeteer-core) -- un
      # segundo navegador completo, redundante con el Chrome que se instala manualmente dos
      # pasos mas abajo. Puesto a nivel de job para que aplique tambien a "npm ci".
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # La semana del año se calcula ANTES del paso de cache, porque la key de
      # actions/cache se evalua al empezar ese paso -- calcularla despues (como en un
      # intento anterior de este mismo archivo) nunca aplicaria la rotacion semanal.
      - name: Set cache week
        run: echo "CACHE_WEEK=$(date +%Y-%U)" >> $GITHUB_ENV

      # Cachea el .deb de Chrome para no volver a bajarlo (~100+ MB) en cada corrida. La
      # clave rota cada semana para igual recibir actualizaciones de Chrome con cierta
      # frecuencia, sin perder el cache en cada ejecucion.
      - name: Cache Google Chrome .deb
        id: cache-chrome-deb
        uses: actions/cache@v4
        with:
          path: /tmp/chrome.deb
          key: chrome-stable-deb-${{ runner.os }}-week-${{ env.CACHE_WEEK }}

      - name: Download Google Chrome (if not cached)
        if: steps.cache-chrome-deb.outputs.cache-hit != 'true'
        run: wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

      - name: Install Google Chrome for Puppeteer
        run: |
          sudo dpkg -i /tmp/chrome.deb 2>/dev/null || sudo apt-get -fy install -qq
          echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable" >> $GITHUB_ENV

      - name: Run scraper
        run: npm start
        env:
          SCRAPER_SUPABASE_URL: ${{ secrets.SCRAPER_SUPABASE_URL }}
          SCRAPER_SUPABASE_KEY: ${{ secrets.SCRAPER_SUPABASE_KEY }}
          SCRAPER_REQUEST_TIMEOUT_MS: 15000
          SCRAPER_MAX_HOUSES: 10
          SCRAPER_CONCURRENCY: 3