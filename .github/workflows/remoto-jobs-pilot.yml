name: Remoto Jobs Pilot

on:
  workflow_dispatch: # ejecución manual por ahora — pásalo a schedule/cron cuando lo valides

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Publish Remoto Jobs a Supabase
        run: npm run remoto:publish
        env:
          SCRAPER_SUPABASE_URL: ${{ secrets.SCRAPER_SUPABASE_URL }}
          SCRAPER_SUPABASE_KEY: ${{ secrets.SCRAPER_SUPABASE_KEY }}

      - name: Run local pilot too (JSON de respaldo, no depende de Supabase)
        if: always()
        run: npm run remoto:pilot

      - name: Upload result as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remoto-jobs
          path: output/remoto-jobs.json
          retention-days: 14
